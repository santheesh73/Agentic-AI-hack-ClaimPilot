name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Fully offline and deterministic: mocked LLM + in-memory DB
      # (see tests/helpers/fakeSupabase.ts). No secrets required.
      - name: Test (mocked LLM, offline) with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      # Build also runs Next's own TypeScript check against generated route
      # types, so it's a second, independent typecheck pass -- not redundant.
      - name: Build
        run: pnpm build
